services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kairos
      POSTGRES_PASSWORD: kairos
      POSTGRES_DB: kairos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"   # management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  kairos:
    build: .
    depends_on:
      - postgres
      - rabbitmq
    environment:
      LISTEN_ADDR: ":8080"
      DATABASE_URL: "postgres://kairos:kairos@postgres:5432/kairos?sslmode=disable"
      AMQP_URL: "amqp://guest:guest@rabbitmq:5672/"
      QUEUE_NAME: "kairos.triggers"
      POLL_INTERVAL_MS: "5000"
    ports:
      - "8080:8080"

volumes:
  pgdata:
