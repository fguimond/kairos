services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: kairos
      POSTGRES_PASSWORD: kairos
      POSTGRES_DB: kairos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"   # management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  kairos:
    build: .
    depends_on:
      - postgres
      - rabbitmq
    environment:
      KAIROS_LISTEN_ADDR: ":8080"
      KAIROS_DATABASE_URL: "postgres://kairos:kairos@postgres:5432/kairos?sslmode=disable"
      KAIROS_AMQP_URL: "amqp://guest:guest@rabbitmq:5672/"
      KAIROS_QUEUE_NAME: "kairos.triggers"
      KAIROS_POLL_INTERVAL_MS: "5000"
    ports:
      - "8080:8080"

volumes:
  postgres_data:
